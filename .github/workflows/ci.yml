name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-website:
    name: Build Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run build

  build-cli:
    name: Build CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Smoke test planmode ci
        working-directory: .
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/plans"
          printf '# Smoke plan\n' > "$tmp/plans/smoke-plan.md"
          printf '# Planmode\n- @plans/smoke-plan.md\n' > "$tmp/CLAUDE.md"
          hash="sha256:$(node -e "const c=require('node:crypto');const fs=require('node:fs');process.stdout.write(c.createHash('sha256').update(fs.readFileSync(process.argv[1],'utf-8')).digest('hex'))" "$tmp/plans/smoke-plan.md")"
          cat > "$tmp/planmode.lock" <<EOF
          lockfile_version: 1
          packages:
            smoke-plan:
              version: 1.0.0
              type: plan
              source: github.com/example/smoke-plan
              tag: v1.0.0
              sha: abc123
              content_hash: $hash
              installed_to: plans/smoke-plan.md
          EOF
          (cd "$tmp" && node "$GITHUB_WORKSPACE/cli/dist/index.js" ci)

  validate-registry:
    name: Validate Registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate all registry JSON
        run: |
          python3 -c "
          import json, os, sys
          errors = 0
          count = 0
          for root, dirs, files in os.walk('registry/packages'):
              for f in files:
                  if not f.endswith('.json'): continue
                  path = os.path.join(root, f)
                  count += 1
                  try:
                      data = json.load(open(path))
                      if 'metadata' in f:
                          for field in ['name','description','author','license','type','latest_version','versions']:
                              if field not in data:
                                  print(f'MISSING {field} in {path}')
                                  errors += 1
                  except Exception as e:
                      print(f'INVALID JSON: {path}: {e}')
                      errors += 1
          print(f'Validated {count} files, {errors} errors')
          if errors > 0:
              sys.exit(1)
          "
